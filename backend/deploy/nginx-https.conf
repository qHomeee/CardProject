server {
    listen 443 ssl;
    server_name @PUBLIC_IP@;

    ssl_certificate /etc/letsencrypt/live/@PUBLIC_IP@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@PUBLIC_IP@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    error_page 413 = @catalog_too_large;
    error_page 502 504 = @catalog_unavailable;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
    }

    location @catalog_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"error":{"code":"payload_too_large","message":"Размер запроса превышает 64 КиБ."}}';
    }

    location @catalog_unavailable {
        default_type application/json;
        charset utf-8;
        return 503 '{"error":{"code":"service_unavailable","message":"Операция временно недоступна."}}';
    }
}

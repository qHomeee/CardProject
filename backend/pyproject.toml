[project]
name = "zapomni-catalog"
version = "0.1.0"
description = "Сервер каталога наборов Запомни"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.163.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
